<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LSM Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/route.css">
  <link rel="stylesheet" href="css/statusbar.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/store.css">
  <link rel="stylesheet" href="css/pastel-overrides.css">
  <link rel="stylesheet" href="css/pixel-cursor.css">
</head>

<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="material-symbols-outlined">sign_language</span>
        <span class="sidebar__brand-text">LSM Quest</span>
      </div>

      <nav class="sidebar__nav" id="sidebar-nav">
        <button class="nav-btn nav-btn--active" data-view="aprender" type="button">
          <span class="material-symbols-outlined nav-btn__icon" style="font-variation-settings: 'FILL' 1;">school</span>
          <span class="nav-btn__label">Aprender</span>
        </button>

        <button class="nav-btn" data-view="tienda" type="button">
          <span class="material-symbols-outlined nav-btn__icon">storefront</span>
          <span class="nav-btn__label">Tienda</span>
        </button>

        <button class="nav-btn" data-view="perfil" type="button">
          <span class="material-symbols-outlined nav-btn__icon">person</span>
          <span class="nav-btn__label">Perfil</span>
        </button>
      </nav>
    </aside>

    <div class="app-main">
      <header class="status-bar">
        <div class="status-bar__spacer"></div>

        <button class="status-pill status-pill--gems" type="button">
          <span class="material-symbols-outlined status-pill__icon">diamond</span>
          <span class="status-pill__text" id="gems-label"></span>
        </button>

        <button class="status-pill status-pill--lives" type="button">
          <span class="material-symbols-outlined status-pill__icon" style="font-variation-settings: 'FILL' 1;">favorite</span>
          <span class="status-pill__text" id="lives-label"></span>
        </button>

        <button class="status-avatar" id="btn-logout" type="button" aria-label="Cerrar sesión">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </header>

      <main class="route" id="main-content"></main>
    </div>
  </div>

  <div id="exercise-modal" class="exercise-modal exercise-modal--hidden">
    <div class="exercise-modal__content">
      <button class="exercise-modal__close" aria-label="Cerrar ejercicio">&times;</button>
      <h2 class="exercise-modal__title">Ejercicio</h2>
      <p class="exercise-modal__body">
        Aquí irá el contenido del ejercicio seleccionado.
      </p>
    </div>
  </div>

  <script src="js/levels.js"></script>
  <script src="js/sidebar.js"></script>
  <script type="module" src="js/statusbar.js"></script>
  <script type="module" src="js/pixel-cursor.js"></script>
  <script type="module" src="js/app.js"></script>
  <script src="js/route-snake.js"></script>

</body>

</html>
