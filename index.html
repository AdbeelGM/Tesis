<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>LSM Quest</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/route.css">
  <link rel="stylesheet" href="css/statusbar.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <div class="app-shell app-shell--locked">
    <!-- LATERAL IZQUIERDO -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__brand-main">LSM</span>
        <span class="sidebar__brand-sub">Quest</span>
      </div>

      <nav class="sidebar__nav" id="sidebar-nav">
        <button class="nav-btn nav-btn--active" data-view="aprender">
          <span class="nav-btn__icon">🏠</span>
          <span class="nav-btn__label">APRENDER</span>
        </button>

        <button class="nav-btn" data-view="tienda">
          <span class="nav-btn__icon">🛒</span>
          <span class="nav-btn__label">TIENDA</span>
        </button>

        <button class="nav-btn" data-view="perfil">
          <span class="nav-btn__icon">👤</span>
          <span class="nav-btn__label">PERFIL</span>
        </button>
      </nav>
    </aside>

    <!-- ZONA DERECHA (HEADER + CONTENIDO) -->
    <div class="app-main">
      <!-- BARRA SUPERIOR DERECHA -->
      <header class="status-bar">
        <div class="status-bar__spacer"></div>

        <button class="status-pill status-pill--lives">
          <span class="status-pill__icon">❤️</span>
          <span class="status-pill__text" id="lives-label"></span>


          <div class="status-pill__popup">
            <p>Aquí podrás ver detalles de tus vidas.</p>
          </div>
        </button>

        <button class="status-pill status-pill--gems">
          <span class="status-pill__icon">💎</span>
          <span class="status-pill__text" id="gems-label"></span>


          <div class="status-pill__popup">
            <p>Aquí se mostrará información sobre tus gemas.</p>
          </div>
        </button>

        <button class="status-pill" id="btn-logout" type="button">Salir</button>
      </header>

      <!-- CONTENIDO CENTRAL -->
      <main class="route">
        <header class="route__header">
          <h1 class="route__title">Ruta de aprendizaje LSM</h1>
          <div class="route__stage-pill">Etapa 1 · Básico</div>
        </header>

        <section class="route__path">
          <!-- Cada nivel -->
           <button class="level-node" data-level="1">1</button>
          <button class="level-node" data-level="2">2</button>
          <button class="level-node" data-level="3">3</button>
          <button class="level-node" data-level="4">4</button>
          <button class="level-node" data-level="5">5</button>
          <button class="level-node" data-level="6">6</button>


        </section>
      </main>
    </div>
  </div>

  <!-- Modal de ejercicio -->
  <div id="exercise-modal" class="exercise-modal exercise-modal--hidden">
    <div class="exercise-modal__content">
      <button class="exercise-modal__close" aria-label="Cerrar ejercicio">&times;</button>
      <h2 class="exercise-modal__title">Ejercicio</h2>
      <p class="exercise-modal__body">
        Aquí irá el contenido del ejercicio seleccionado.
      </p>
    </div>
  </div>

  <div id="login-overlay" class="login-overlay">
    <form id="login-form" class="login-card" novalidate>
      <h2>Iniciar sesión</h2>
      <label for="login-usuario">Usuario</label>
      <input id="login-usuario" name="usuario" type="text" required minlength="3" />

      <label for="login-password">Contraseña</label>
      <input id="login-password" name="password" type="password" required minlength="3" />

      <p id="login-error" class="login-error"></p>
      <button type="submit" class="login-btn">Entrar</button>
    </form>
  </div>

  <!-- JS -->
  <script src="js/levels.js"></script>
  <script src="js/sidebar.js"></script>
  <script type="module" src="js/statusbar.js"></script>
  <script type="module" src="js/app.js"></script>

  <script src="js/route-snake.js"></script>

</body>

</html>
