<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso | LSM Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>

<body class="auth-page">
  <div class="auth-page__pattern" aria-hidden="true"></div>

  <main class="auth-layout">
    <section class="auth-hero" aria-label="Bienvenida a LSM Quest">
      <div class="auth-hero__art">
        <div class="auth-hero__glow"></div>
        <img src="img/hola.png" alt="Personaje saludando en lengua de señas" class="auth-hero__image">
        <div class="auth-hero__overlay">
          <div class="auth-hero__badge">
            <span class="material-symbols-outlined">sign_language</span>
            <span>Conecta cada gesto con su significado.</span>
          </div>

          <div class="auth-hero__copy">
            <h1>¡Bienvenido a LSM Quest!</h1>
            <p>Aprende Lengua de Señas Mexicana con aventuras interactivas y divertidas.</p>
          </div>

        </div>
      </div>
    </section>

    <section class="auth-shell">
      <div class="auth-card">
        <div class="auth-toggle" role="tablist" aria-label="Cambiar formulario">
          <button id="tab-login" class="auth-toggle__btn auth-toggle__btn--active" data-tab="login" role="tab" aria-controls="login-form" aria-selected="true">Iniciar sesión</button>
          <button id="tab-register" class="auth-toggle__btn" data-tab="register" role="tab" aria-controls="register-form" aria-selected="false">Registrarse</button>
        </div>

        <form id="login-form" class="auth-form" novalidate>
          <label class="auth-field" for="login-usuario">
            <span class="auth-field__label">Usuario</span>
            <span class="auth-field__control">
              <span class="material-symbols-outlined auth-field__icon">person</span>
              <input id="login-usuario" name="usuario" type="text" autocomplete="username" placeholder="Ingresa tu usuario" required maxlength="80" />
            </span>
          </label>

          <label class="auth-field" for="login-password">
            <span class="auth-field__label">Contraseña</span>
            <span class="auth-field__control">
              <span class="material-symbols-outlined auth-field__icon">lock</span>
              <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required minlength="3" maxlength="80" />
              <button type="button" class="auth-field__toggle" data-toggle-password="login-password" aria-label="Mostrar contraseña">
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </span>
          </label>

          <div class="auth-form__meta">
            <a href="#" class="auth-link">¿Olvidaste tu contraseña?</a>
          </div>

          <p id="login-error" class="auth-message auth-message--error" role="alert"></p>

          <button type="submit" class="auth-btn auth-btn--primary">
            <span>Entrar</span>
            <span class="material-symbols-outlined">arrow_forward</span>
          </button>

          <div class="auth-divider"><span>O continúa con</span></div>

          <button type="button" class="auth-btn auth-btn--social">
            <span class="auth-btn__google-mark" aria-hidden="true"></span>
            <span>Google</span>
          </button>
        </form>

        <form id="register-form" class="auth-form auth-form--hidden" novalidate>

          <label class="auth-field" for="register-usuario">
            <span class="auth-field__label">Usuario</span>
            <span class="auth-field__control">
              <span class="material-symbols-outlined auth-field__icon">person</span>
              <input id="register-usuario" name="usuario" type="text" autocomplete="username" placeholder="Crea tu usuario" required maxlength="80" />
            </span>
          </label>

          <label class="auth-field" for="register-password">
            <span class="auth-field__label">Contraseña</span>
            <span class="auth-field__control">
              <span class="material-symbols-outlined auth-field__icon">lock</span>
              <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Crea tu contraseña" required minlength="3" maxlength="80" />
              <button type="button" class="auth-field__toggle" data-toggle-password="register-password" aria-label="Mostrar contraseña">
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </span>
          </label>

          <p id="register-error" class="auth-message auth-message--error" role="alert"></p>
          <p id="register-ok" class="auth-message auth-message--ok" role="status"></p>

          <button type="submit" class="auth-btn auth-btn--primary">
            <span>Crear cuenta</span>
            <span class="material-symbols-outlined">arrow_forward</span>
          </button>

        </form>
      </div>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>

</html>
