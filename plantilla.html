<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ejercicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/exercise-mc.css" />
</head>

<body>
  <!-- LSM Quest exercise shell -->
  <main class="exercise">
    <header class="exercise__topbar">
      <div class="topbar__brand">
        <span class="material-symbols-outlined brand__icon">sign_language</span>
        <span class="brand__text">LSM Quest</span>
      </div>

      <div class="topbar__progressWrap">
        <div class="topbar__progressHead">
          <span class="topbar__label">LESSON PROGRESS</span>
          <span class="topbar__pct" id="progressPct">0%</span>
        </div>
        <div class="progress__track">
          <div class="progress__fill" id="progressFill" style="width:0%"></div>
        </div>
      </div>

      <div class="topbar__lives" id="lives" aria-label="Vidas">
        <span class="material-symbols-outlined lives__icon">favorite</span>
        <span class="lives__count" id="livesCount">5</span>
        <span class="heart heart--on">♥</span>
        <span class="heart heart--on">♥</span>
        <span class="heart heart--on">♥</span>
        <span class="heart heart--on">♥</span>
        <span class="heart heart--on">♥</span>
      </div>

      <button class="topbar__exit" id="btnExit" aria-label="Salir">
        <span class="material-symbols-outlined">close</span>
      </button>
    </header>

    <section class="exercise__card">
      <div class="exercise__media">
        <img id="mediaImg" alt="Seña" />
        <video id="mediaVideo" controls style="display:none"></video>
      </div>

      <h2 class="exercise__prompt" id="promptText"></h2>
      <p class="exercise__kicker">Select the correct translation</p>

      <div class="exercise__options" id="options"></div>
    </section>

    <footer class="exercise__actions">
      <div class="exercise__feedback" id="feedback" style="display:none"></div>
      <button class="btn btn--ghost" id="btnSkip">Saltar</button>
      <button class="btn btn--primary" id="btnCheck">Comprobar <span class="material-symbols-outlined">arrow_forward</span></button>
    </footer>
  </main>

  <script type="module" src="js/app-exercise.js"></script>
</body>
</html>
